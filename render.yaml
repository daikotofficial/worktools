services:
  - type: web
    name: daikot-worktools
    runtime: python
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=src uvicorn statement_analyzer.webapp:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STATEMENT_ANALYZER_RUNTIME_DIR
        value: /tmp/daikot-worktools
      - key: STATEMENT_ANALYZER_MAX_UPLOAD_MB
        value: 50
      - key: STATEMENT_ANALYZER_MAX_PAGES
        value: 250
      - key: ADSENSE_CLIENT_ID
        sync: false
      - key: ADSENSE_PUBLISHER_ID
        sync: false
      - key: SOCIAL_X_URL
        sync: false
      - key: SOCIAL_FACEBOOK_URL
        sync: false
      - key: SOCIAL_LINKEDIN_URL
        sync: false
      - key: SOCIAL_INSTAGRAM_URL
        sync: false
      - key: SOCIAL_TIKTOK_URL
        sync: false
